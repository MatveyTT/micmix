[package]
name = "micmix-engine"
version = "0.3.0"
edition = "2021"
description = "MicMix: захват звука приложений, микшер и передача в APO микрофона"

[lib]
name = "micmix_core"
path = "src/lib.rs"

[[bin]]
name = "micmix-engine"
path = "src/main.rs"

[dependencies]
wasapi = "0.26.0"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4"] }
tungstenite = "0.30.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
