[package]
name = "micmix"
version = "0.2.0"
edition = "2021"
description = "MicMix — звук приложений прямо в микрофон"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
micmix-engine = { path = "../../engine" }
