[package]
name = "micmix"
version = "0.3.0"
edition = "2021"
description = "MicMix — звук приложений прямо в микрофон"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-dialog = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
micmix-engine = { path = "../../engine" }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
